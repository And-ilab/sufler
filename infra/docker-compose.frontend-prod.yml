# Override: serve built SPA via nginx instead of Vite HMR.
# Use on the bank TEST/PROD VM so the UI does not white-screen on 504 from Vite.
#
# Applied by default from local-inference/up-cpu.sh (FRONTEND_MODE=prod).
name: sufler

services:
  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile.prod
    image: ${FRONTEND_IMAGE:-sufler-frontend:local}
    restart: unless-stopped
    # Clear Vite-only settings from docker-compose.yml (Compose merge reset).
    environment: !reset {}
    volumes: !reset []
    command: !reset []
    ports: !override
      - "${FRONTEND_PORT_HOST:-5173}:80"
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "-qO-",
          "http://127.0.0.1/healthz",
        ]
      interval: 15s
      timeout: 3s
      retries: 8
      start_period: 10s
